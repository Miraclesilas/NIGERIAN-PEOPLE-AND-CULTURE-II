function showExam(){show("exam");let q=E.pool[E.i],sel=E.a[q.id];document.getElementById("exam").innerHTML=`<div class="card"><div class="row between"><b>Question ${E.i+1} of ${E.pool.length}</b><span class="timer" id="timer"></span></div><div class="progress"><span style="width:${(E.i+1)/E.pool.length*100}%"></span></div><h2>${esc(q.question)}</h2>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="a" ${sel===i?"checked":""} onchange="ans(${i})">${esc(o)}</label>`).join("")}<div class="row between"><button class="secondary" onclick="prev()" ${E.i===0?"disabled":""}>Previous</button><button class="secondary" onclick="flag()">${E.f.has(q.id)?"⚑ Flagged":"⚐ Flag"}</button>${E.i===E.pool.length-1?'<button class="gold" onclick="submit(false)">Submit exam</button>':'<button onclick="next()">Next</button>'}</div><p style="font-size:.84rem;color:#687386">Answer options are randomized for every new attempt.</p><div class="row" style="margin-top:14px">${E.pool.map((x,i)=>`<button class="qnum ${E.a[x.id]!==undefined?"answered ":""}${E.f.has(x.id)?"flagged ":""}${i===E.i?"current":""}" onclick="go(${i})">${i+1}</button>`).join("")}</div><p class="flag">Unanswered: ${E.pool.filter(x=>E.a[x.id]===undefined).length}</p></div>`;tick()}
function ans(i){E.a[E.pool[E.i].id]=i;showExam()} function next(){if(E.i<E.pool.length-1){E.i++;showExam()}} function prev(){if(E.i>0){E.i--;showExam()}} function go(i){E.i=i;showExam()} function flag(){let id=E.pool[E.i].id;E.f.has(id)?E.f.delete(id):E.f.add(id);showExam()}
function submit(auto){if(!auto&&!confirm("Submit this exam?"))return;clearInterval(E.int);let c=E.pool.filter(q=>E.a[q.id]===q.answer).length,total=E.pool.length,p=Math.round(c/total*100);let r={user:S.current,date:new Date().toISOString(),correct:c,total,pct:p,unanswered:E.pool.filter(q=>E.a[q.id]===undefined).length};S.history.unshift(r);U().attempts++;save();let peers=S.history.filter(x=>x.total===total).sort((a,b)=>b.pct-a.pct),rank=peers.findIndex(x=>x===r)+1;document.getElementById("resultBox").innerHTML=`<div class="celebrate">${p>=70?"🎉":"📚"}</div><h2 style="text-align:center">${p>=70?"Congratulations!":"Exam submitted"}</h2><p style="text-align:center;font-size:1.2rem"><b>${c}/${total} — ${p}%</b></p><p style="text-align:center">Ranking: <b>#${rank}</b> of ${peers.length} recorded attempts (${total}-question exams).</p>${p<30?'<p style="text-align:center;color:#c83b4b"><b>Try again to improve.</b></p>':'<p style="text-align:center;color:#16855b">Keep practising to improve consistency.</p>'}<div class="row" style="justify-content:center"><button onclick="closeM('result');history()">History</button><button class="gold" onclick="share()">Share score</button></div>`;document.getElementById("result").classList.add("show");E=null}
function share(){let u=U(),r=S.history[0],txt=`I scored ${r.pct}% (${r.correct}/${r.total}) in GST 121 Nigerian People & Culture CBT practice.`;navigator.share?navigator.share({title:"GST 121 CBT score",text:txt}):navigator.clipboard?.writeText(txt).then(()=>alert("Score copied."))}
function history(){show("history");nav();let rs=S.history.filter(x=>x.user===S.current).map(x=>`<tr><td>${new Date(x.date).toLocaleString()}</td><td>${x.correct}/${x.total}</td><td>${x.pct}%</td><td>${x.unanswered}</td></tr>`).join("");document.getElementById("history").innerHTML=`<div class="card"><h2>Past performance</h2><table><tr><th>Date</th><th>Score</th><th>%</th><th>Unanswered</th></tr>${rs||"<tr><td colspan=4>No attempts yet.</td></tr>"}</table></div>`}
function profile(){show("profile");nav();let u=U();document.getElementById("profile").innerHTML=`<div class="card"><h2>My profile</h2><label>Username<input value="${esc(u.username)}" disabled></label><br><label>Email<input id="pe" value="${esc(u.email||"")}"></label><br><label>Bio<input id="pb" value="${esc(u.bio||"")}"></label><br><button class="gold" onclick="saveP()">Save profile</button></div>`}
function saveP(){let u=U();u.email=pe.value;u.bio=pb.value;save();alert("Profile updated.")}
function openAdmin(){document.getElementById("adminM").classList.add("show")}
function adminLogin(e){e.preventDefault();if(ae.value!==ADMIN_EMAIL||ap.value!==ADMIN_PASSWORD){adm.textContent="Invalid administrator credentials.";return}S.admin=true;save();closeM("adminM");admin()}
function admin(){if(!S.admin)return openAdmin();show("admin");nav();let users=S.users.map((u,i)=>`<tr><td>${esc(u.username)}</td><td>${esc(u.email||"")}</td><td>${u.approved?"Approved":"Pending"}</td><td>${u.attempts}</td><td><button class="gold" onclick="grant(${i})">${u.approved?"Revoke":"Grant all"}</button> <button class="danger" onclick="del(${i})">Delete</button></td></tr>`).join("");document.getElementById("admin").innerHTML=`<div class="card"><h2>Admin portal</h2><p>User authorization, approval/revocation and deletion.</p><table><tr><th>User</th><th>Email</th><th>Access</th><th>Attempts</th><th>Actions</th></tr>${users||"<tr><td colspan=5>No users.</td></tr>"}</table></div>`}
function grant(i){S.users[i].approved=!S.users[i].approved;save();admin()} function del(i){if(confirm("Delete this user and their history?")){let x=S.users[i].username;S.users.splice(i,1);S.history=S.history.filter(r=>r.user!==x);save();admin()}}
home();
</script></body></html>.
